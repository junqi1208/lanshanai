name: Deploy front-web

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-front-web.yml'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Node
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to web root
        run: rsync -avzr --delete dist/ /www/wwwroot/lanshanai/